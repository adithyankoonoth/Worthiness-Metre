<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MJÖLNIR // WORTHINESS EVALUATION</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #050608;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }
    .shell {
      width: min(920px, 94vw);
      padding: 42px 28px;
      border: 1px solid #30343a;
      background: linear-gradient(145deg, #0b0d10, #050608);
      box-shadow: 0 0 70px rgba(255,255,255,.035);
      position: relative;
    }
    .topline {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #777d85;
      font-size: 11px;
      letter-spacing: 2px;
    }
    h1 {
      margin: 26px 0 4px;
      font-size: clamp(28px, 6vw, 62px);
      letter-spacing: 7px;
      line-height: 1;
      font-weight: 800;
    }
    .subtitle {
      color: #858a91;
      letter-spacing: 4px;
      font-size: 12px;
    }
    .score {
      text-align: center;
      margin: 58px 0 24px;
    }
    .number {
      font-size: clamp(76px, 17vw, 150px);
      line-height: .85;
      font-weight: 900;
      letter-spacing: -7px;
    }
    .label {
      margin-top: 18px;
      font-size: clamp(26px, 5vw, 48px);
      font-weight: 900;
      letter-spacing: 8px;
    }
    .status {
      margin: 8px auto 0;
      color: #777d85;
      font-size: 12px;
      letter-spacing: 2px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin-top: 50px;
      background: #30343a;
    }
    .cell {
      background: #0b0d10;
      padding: 20px;
    }
    .key {
      color: #686e76;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 9px;
    }
    .value { font-size: 20px; font-weight: 700; }
    .message {
      margin-top: 30px;
      padding: 20px;
      border-left: 2px solid #777;
      color: #b8bdc4;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .footer {
      margin-top: 34px;
      color: #454a50;
      font-size: 9px;
      letter-spacing: 2px;
      text-align: center;
    }
    @media (max-width: 650px) {
      .grid { grid-template-columns: 1fr; }
      .shell { padding: 28px 18px; }
      h1 { letter-spacing: 4px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topline">
      <span>ASGARD // SECURE TERMINAL</span>
      <span id="connection">OFFLINE</span>
    </div>

    <h1>MJÖLNIR</h1>
    <div class="subtitle">WORTHINESS EVALUATION SYSTEM™</div>

    <section class="score">
      <div class="number" id="score">--</div>
      <div class="label" id="verdict">AWAITING</div>
      <div class="status" id="message">Perform a motion to begin evaluation.</div>
    </section>

    <section class="grid">
      <div class="cell">
        <div class="key">MOTION</div>
        <div class="value" id="motion">--</div>
      </div>
      <div class="cell">
        <div class="key">MODEL CONFIDENCE</div>
        <div class="value" id="confidence">--</div>
      </div>
      <div class="cell">
        <div class="key">EVALUATION COUNT</div>
        <div class="value" id="count">0</div>
      </div>
    </section>

    <div class="message" id="quote">The hammer is currently judging you.</div>
    <div class="footer">ESP8266 // MPU6050 // TINYML // MJÖLNIR PROTOCOL</div>
  </main>

  <script>
    let count = 0;

    function render(data) {
      document.getElementById('connection').textContent = 'ONLINE';
      document.getElementById('score').textContent = data.score ?? '--';
      document.getElementById('verdict').textContent = data.worthy ? 'WORTHY' : (data.motion ? 'NOT WORTHY' : 'AWAITING');
      document.getElementById('motion').textContent = data.motion ?? '--';
      document.getElementById('confidence').textContent = data.confidence == null ? '--' : data.confidence.toFixed(1) + '%';
      document.getElementById('message').textContent = data.message ?? 'Awaiting evaluation.';
      document.getElementById('quote').textContent = data.worthy
        ? 'The hammer has accepted you.'
        : (data.motion ? 'Thor has declined your application.' : 'The hammer is currently judging you.');
      if (data.evaluated) {
        count++;
        document.getElementById('count').textContent = count;
      }
    }

    async function poll() {
      try {
        const response = await fetch('/api/status', { cache: 'no-store' });
        if (!response.ok) throw new Error('offline');
        render(await response.json());
      } catch (error) {
        document.getElementById('connection').textContent = 'OFFLINE';
      }
    }

    poll();
    setInterval(poll, 500);
  </script>
</body>
</html>
